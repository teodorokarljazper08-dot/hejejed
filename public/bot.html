<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KARL — Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#07090f;--surface:#0d1120;--border:#1c2238;--border2:#252d45;--white:#eef0f7;--muted:#5a6285;--muted2:#2e3554;--accent:#f5a623;--green:#22c55e;--red:#ef4444;--yellow:#eab308}
body{background:var(--bg);color:var(--white);font-family:'Space Grotesk',sans-serif;min-height:100vh}
nav{display:flex;align-items:center;justify-content:space-between;padding:16px 32px;border-bottom:1px solid var(--border);background:var(--surface)}
.logo{font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:3px;color:var(--accent);font-size:.95rem}
.btn{padding:8px 16px;border-radius:3px;font-size:.65rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;border:none;font-family:'JetBrains Mono',monospace;transition:all .15s;text-decoration:none;display:inline-block}
.btn-accent{background:var(--accent);color:#07090f}.btn-accent:hover{background:#f0b84a}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted)}.btn-outline:hover{border-color:var(--accent);color:var(--accent)}
.btn-red{background:transparent;border:1px solid #ef444440;color:var(--red)}.btn-red:hover{background:#ef444420}
.btn-green{background:transparent;border:1px solid #22c55e40;color:var(--green)}.btn-green:hover{background:#22c55e20}
main{max-width:1000px;margin:0 auto;padding:32px 24px}
.bot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.bot-title{font-size:1.3rem;font-weight:600}
.bot-sub{font-size:.72rem;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:4px}
.status-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:20px;font-size:.68rem;font-weight:500;font-family:'JetBrains Mono',monospace}
.chip-running{background:rgba(34,197,94,.1);border:1px solid rgba(34,197,94,.3);color:var(--green)}
.chip-stopped{background:rgba(90,98,133,.1);border:1px solid var(--border2);color:var(--muted)}
.status-dot{width:6px;height:6px;border-radius:50%}
.dot-running{background:var(--green);box-shadow:0 0 6px var(--green);animation:glow 2s infinite}
.dot-stopped{background:var(--muted2)}
@keyframes glow{0%,100%{box-shadow:0 0 4px var(--green)}50%{box-shadow:0 0 12px var(--green)}}
.card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:20px;margin-bottom:16px}
.card-title{font-size:.65rem;font-weight:500;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.log-box{background:#020409;border:1px solid var(--border);border-radius:4px;padding:16px;height:400px;overflow-y:auto;font-family:'JetBrains Mono',monospace;font-size:.72rem;line-height:1.7;color:#94a3b8;white-space:pre-wrap;word-break:break-all}
.log-box::-webkit-scrollbar{width:6px}
.log-box::-webkit-scrollbar-track{background:transparent}
.log-box::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.zip-notice{background:rgba(245,166,35,.06);border:1px solid rgba(245,166,35,.2);border-radius:4px;padding:16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.zip-notice-text{font-size:.82rem;color:var(--accent)}
.info-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.info-item label{font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:4px}
.info-item value{font-size:.82rem;font-family:'JetBrains Mono',monospace}
</style></head><body>
<nav>
  <div class="logo">KARL</div>
  <a href="/dashboard" class="btn btn-outline">← Dashboard</a>
</nav>
<main>
  <div id="zip-notice" style="display:none" class="zip-notice">
    <span class="zip-notice-text">📦 ZIP file uploaded — extract it before starting the bot</span>
    <button class="btn btn-accent" onclick="extractBot()">📦 Extract ZIP</button>
  </div>

  <div class="bot-header">
    <div>
      <div class="bot-title" id="bot-name">Loading...</div>
      <div class="bot-sub" id="bot-id">...</div>
    </div>
    <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span id="status-chip" class="status-chip chip-stopped"><span class="status-dot dot-stopped" id="status-dot"></span><span id="status-text">Stopped</span></span>
      <div class="actions" id="bot-actions"></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Info</div>
    <div class="info-grid">
      <div class="info-item"><label>Bot ID</label><value id="i-id">-</value></div>
      <div class="info-item"><label>Main File</label><value id="i-main">-</value></div>
      <div class="info-item"><label>Status</label><value id="i-status">-</value></div>
      <div class="info-item"><label>Uptime</label><value id="i-uptime">-</value></div>
    </div>
  </div>

  <div class="card">
    <div class="card-title" style="display:flex;justify-content:space-between">
      <span>Output Logs</span>
      <button class="btn btn-outline" style="padding:4px 10px;font-size:.6rem" onclick="loadLogs()">Refresh</button>
    </div>
    <div class="log-box" id="log-box">Loading logs...</div>
  </div>

  <div class="card">
    <div class="card-title">Danger Zone</div>
    <button class="btn btn-red" onclick="deleteBot()">🗑 Delete Bot</button>
  </div>
</main>
<script>
const botId = window.location.pathname.split('/').pop();
let currentBot = null;

async function init() {
  await loadBot();
  await loadLogs();
}

async function loadBot() {
  const r = await fetch(`/api/bots/${botId}`).then(r=>r.json());
  if (!r.success) { window.location.href='/dashboard'; return; }
  const b = currentBot = r.bot;
  document.title = `KARL — ${b.name}`;
  document.getElementById('bot-name').textContent = b.name;
  document.getElementById('bot-id').textContent = `ID: ${b.id} · ${b.main_file||'main.py'}`;
  document.getElementById('i-id').textContent = b.id;
  document.getElementById('i-main').textContent = b.main_file||'main.py';
  document.getElementById('i-status').textContent = b.live ? 'Running' : b.status;
  document.getElementById('i-uptime').textContent = b.live ? fmtUptime(b.uptime) : '—';

  // ZIP notice
  document.getElementById('zip-notice').style.display = b.zip_path ? 'flex' : 'none';

  // Status chip
  const chip = document.getElementById('status-chip');
  const dot  = document.getElementById('status-dot');
  const txt  = document.getElementById('status-text');
  if (b.live) { chip.className='status-chip chip-running'; dot.className='status-dot dot-running'; txt.textContent='Running'; }
  else { chip.className='status-chip chip-stopped'; dot.className='status-dot dot-stopped'; txt.textContent='Stopped'; }

  // Actions
  const acts = document.getElementById('bot-actions');
  if (b.zip_path) {
    acts.innerHTML = '';
  } else if (b.live) {
    acts.innerHTML = `<button class="btn btn-red" onclick="stopBot()">⏹ Stop</button>`;
  } else {
    acts.innerHTML = `<button class="btn btn-green" onclick="startBot()">▶ Start</button>`;
  }
}

function fmtUptime(s) {
  if (!s) return '0s';
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sec=s%60;
  return h?`${h}h ${m}m`:(m?`${m}m ${sec}s`:`${sec}s`);
}

async function startBot() {
  const r = await fetch(`/api/bots/${botId}/start`,{method:'POST'}).then(r=>r.json());
  if (!r.ok && r.error) alert(r.error);
  setTimeout(()=>{ loadBot(); loadLogs(); }, 1000);
}

async function stopBot() {
  await fetch(`/api/bots/${botId}/stop`,{method:'POST'});
  setTimeout(loadBot, 500);
}

async function extractBot() {
  const btn = document.querySelector('#zip-notice .btn-accent');
  btn.disabled=true; btn.textContent='Extracting...';
  const r = await fetch(`/api/bots/${botId}/extract`,{method:'POST'}).then(r=>r.json());
  alert(r.success ? '✅ ' + r.message : '❌ ' + r.message);
  loadBot(); loadLogs();
}

async function loadLogs() {
  const r = await fetch(`/api/bots/${botId}/logs`).then(r=>r.json());
  const box = document.getElementById('log-box');
  box.textContent = r.logs || '(no output yet)';
  box.scrollTop = box.scrollHeight;
}

async function deleteBot() {
  if (!confirm('Delete this bot? This cannot be undone.')) return;
  await fetch(`/api/bots/${botId}`,{method:'DELETE'});
  window.location.href='/dashboard';
}

init();
setInterval(()=>{ loadBot(); if(currentBot?.live) loadLogs(); }, 4000);
</script>
</body></html>
